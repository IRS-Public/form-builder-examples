# Serves the prebuilt static site. The web root is the generator's ./out directory, so
# /app/benefits/ and /app/benefits/resources/fact-dictionary.xml resolve as
# written on disk. Each flow route is its own directory + index.html, so there is no SPA fallback
# to configure.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }
}
