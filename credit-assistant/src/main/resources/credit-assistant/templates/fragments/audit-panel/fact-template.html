<template id="audit-panel__fact">
   <h3 part="heading" class="audit-panel__fact__path">REPLACE_ME_WITH_FACT_PATH</h3>
   <dl part="fact-data">
      <dt part="fact-term" th:text="#{audit.fact.type}"></dt>
      <dd part="fact-definition" class="audit-panel__fact__type"></dd>
   </dl>
   <dl part="fact-data">
      <dt part="fact-term" th:text="#{audit.fact.value}"></dt>
      <dd part="fact-definition" class="audit-panel__fact__value"></dd>
   </dl>
   <div class="audit-panel__fact__definition">
      <pre part="code-block">
					<code>
						<slot name="definition"></slot>
					</code>
				</pre>
   </div>
   <div class="audit-panel__fact__controls">
      <button
         part="remove-button"
         class="usa-button audit-panel__fact__remove"
         onlick="trackSelectedFact()"
         th:text="#{audit.fact.remove}"
         type="button"></button>
   </div>
</template>
