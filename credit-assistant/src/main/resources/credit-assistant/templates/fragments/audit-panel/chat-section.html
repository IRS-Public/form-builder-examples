<div class="audit-panel__section audit-panel__section--chat" id="audit-panel-explain-section" data-tab="chat-explain">
   <h2>Explain &amp; Analyze</h2>
   <div id="chat-status" class="chat-status"></div>
   <!-- role="log" makes this a named live region (chat entries are appended over time); without a
        role, html-validate's aria-label-misuse rejects aria-label on a bare div. -->
   <div id="chat-messages" class="chat-messages" role="log" aria-live="polite" aria-label="Chat conversation"></div>
   <div class="chat-input-row">
      <div class="usa-form-group">
      <label
         class="usa-label twe-question"
         th:for="chat-fact-select"
         th:text="#{audit.fact-select.question}"></label>
      <div class="ap-fact-row">
         <input
            list="chat-fact-options"
            class="usa-input"
            onkeydown="pathSelectListener(event)"
            id="chat-fact-select">
         <button
            class="usa-button usa-button--unstyled"
            type="button"
            title="Clear all tracked facts"
            aria-label="Clear all tracked facts"
            onclick="clearTrackedFacts()">Clear facts</button>
      </div>
      <datalist id="chat-fact-options" aria-invalid="false"></datalist>
   </div>
   <textarea
      class="chat-container__textarea"
      placeholder="Ask me about The EITC Assistant..."
      aria-label="Ask the EITC Assistant"
      rows="3"
      ></textarea>
      <button id="chat-submit-btn" class="chat-container__submit-btn" type="button" aria-label="Submit question to EITC Assistant">Send</button>
   </div>
</div>
