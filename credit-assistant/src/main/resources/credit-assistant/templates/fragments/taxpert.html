<!-- ─── Rail Collapse Button ────────────────────────────────── -->
<!-- Separate fragment so it renders at body level, outside the rail.
     position:fixed only works relative to the viewport when the element
     is NOT inside a stacking-context parent (like position:relative). -->

<button th:fragment="collapse-btn"
        type="button" class="taxpert-rail-collapse" id="taxpert-rail-collapse"
        aria-label="Collapse panel" aria-expanded="true" aria-controls="taxpert-panel">
  <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
       fill="none" stroke="currentColor" stroke-width="2.5"
       aria-hidden="true" focusable="false">
    <polyline points="15 18 9 12 15 6"/>
  </svg>
</button>


<!-- ─── Right Rail ─────────────────────────────────────────── -->

<div th:fragment="rail" class="taxpert-rail" aria-label="Taxpert tool panels">

  <!-- Resize handle (visible only when expanded) -->
  <div class="taxpert-rail-resize-handle" id="taxpert-rail-resize-handle"
       aria-label="Resize rail panel" role="separator"></div>

  <!-- Tab strip (left column — magenta) -->
  <div class="taxpert-tabs" role="tablist" aria-label="Tool panels">

    <button type="button" role="tab" class="taxpert-tab active"
            data-tab="inspection"
            id="taxpert-tab-inspection"
            aria-selected="true"
            aria-controls="taxpert-panel-inspection">Inspection</button>

    <button type="button" role="tab" class="taxpert-tab"
            data-tab="factgraph"
            id="taxpert-tab-factgraph"
            aria-selected="false"
            aria-controls="taxpert-panel-factgraph">FG copy, paste, choose</button>

    <button type="button" role="tab" class="taxpert-tab"
            data-tab="dashboards"
            id="taxpert-tab-dashboards"
            aria-selected="false"
            aria-controls="taxpert-panel-dashboards">Dashboards</button>

    <button type="button" role="tab" class="taxpert-tab"
            data-tab="authoring"
            id="taxpert-tab-authoring"
            aria-selected="false"
            aria-controls="taxpert-panel-authoring">Authoring</button>

  </div><!-- /taxpert-tabs -->

  <!-- Panel area (right column) -->
  <div class="taxpert-panel" id="taxpert-panel">

    <div class="taxpert-panel-title" id="taxpert-panel-label" aria-live="polite">Inspection</div>

    <!-- Inspection panel (default active) -->
    <div class="taxpert-panel-content"
         id="taxpert-panel-inspection"
         role="tabpanel"
         aria-labelledby="taxpert-tab-inspection">
      <p class="taxpert-placeholder">Fact graph inspector will mount here.</p>
    </div>

    <!-- FG copy / paste / choose panel -->
    <div class="taxpert-panel-content hidden"
         id="taxpert-panel-factgraph"
         role="tabpanel"
         aria-labelledby="taxpert-tab-factgraph"
         hidden>
      <p class="taxpert-placeholder">Fact graph import and export tools will mount here.</p>
    </div>

    <!-- Dashboards panel -->
    <div class="taxpert-panel-content hidden"
         id="taxpert-panel-dashboards"
         role="tabpanel"
         aria-labelledby="taxpert-tab-dashboards"
         hidden>
      <p class="taxpert-placeholder">Disqualification and filing status dashboards will mount here.</p>
    </div>

    <!-- Authoring panel -->
    <div class="taxpert-panel-content hidden"
         id="taxpert-panel-authoring"
         role="tabpanel"
         aria-labelledby="taxpert-tab-authoring"
         hidden>
      <p class="taxpert-placeholder">Authoring tools will mount here.</p>
    </div>

    <!-- Chat widget (persistent at panel bottom) -->
    <div class="taxpert-chat">
      <input type="text" class="taxpert-chat-input"
             id="taxpert-chat-input"
             placeholder="Ask me about the EITC Assistant…"
             aria-label="Ask Taxpert assistant" />
      <div class="taxpert-chat-actions" role="group" aria-label="Quick actions">
        <button type="button" class="taxpert-chat-chip" data-action="load-scenario">load a scenario</button>
        <button type="button" class="taxpert-chat-chip" data-action="find-something">find something</button>
        <button type="button" class="taxpert-chat-chip" data-action="look-for-efficiencies">look for efficiencies</button>
      </div>
    </div><!-- /taxpert-chat -->

  </div><!-- /taxpert-panel -->

</div><!-- /taxpert-rail -->
