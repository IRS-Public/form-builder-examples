<taxpert-audit-panel id="audit-panel"
   aria-label="Audit Panel"
   api-base="http://localhost:8000"
   scenarios-base="/app/eitc/resources/scenarios"
   fact-dictionary-url="/app/eitc/resources/fact-dictionary.xml"
   th:attr="ai-scenario-generation-default=${flags.aiScenarioGeneration != null and flags.aiScenarioGeneration ? 'true' : 'false'},
            ai-fact-explanation-default=${flags.aiFactExplanation != null and flags.aiFactExplanation ? 'true' : 'false'},
            author-mode-default=${flags.authorMode != null and flags.authorMode ? 'true' : 'false'}">
   <!-- Host-supplied scenario options (light-DOM children, read on connect). Wrapped in a
        <template> so the page HTML stays valid; only emitted in scenario mode. -->
   <template th:if="${flags.scenarioMode and scenarios != null and !scenarios.isEmpty()}">
      <option th:each="scenario : ${scenarios}"
              th:value="${scenario.filename}"
              th:text="${scenario.label}"></option>
   </template>
</taxpert-audit-panel>
<script type="module">
   // Register credit-assistant's EITC-specific panel extensions (kept in CA, not taxpert):
   // the Eligibility dashboard and the scenario-filter vocabulary.
   import '/app/eitc/resources/vendor/taxpert/dist/js/taxpert.js'
   import { registerEligibilityDashboard } from '/app/eitc/resources/js/eligibility-dashboard-plugin.js'
   import { registerScenarioFilters } from '/app/eitc/resources/js/scenario-filters.js'
   const panel = document.querySelector('#audit-panel')
   registerEligibilityDashboard(panel)
   registerScenarioFilters(panel)
</script>
