# Serves the prebuilt static site. Web root is the generator's ./out directory, so
# /app/eitc/ and /app/eitc/resources/fact-dictionary.xml resolve as written on disk.
# Each flow route is its own directory + index.html, so no SPA fallback is needed.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }
}
