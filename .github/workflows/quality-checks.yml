name: Quality Checks

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

# Cancel redundant runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # do not cancel redundant runs on main or release branches
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/release/') }}

env:
  JAVA_VERSION: 21
  SBT_VERSION: 1.11.4
  NODE_VERSION: 22.16.0

jobs:

  check-emails:
    name: Commit email policy
    runs-on: ubuntu-latest
    steps:
      - name: Check commit author emails
        uses: IRSDigitalService/shared-actions/.github/actions/check-commit-emails@d39382f7b23cb52c0762b5e321f29f2ed66e8189
        with:
          repo_path: form-builder-examples
          base_ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || 'main' }}

  lint:
    name: Lint ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: credit-assistant
            resources: src/main/resources/credit-assistant
          - app: tax-withholding-estimator
            # This one names its resources directory after the app's short id, not its repo folder.
            resources: src/main/resources/twe
            uswds: true
          - app: benefits-enrollment
            resources: src/main/resources/benefits-enrollment
          - app: direct-file
            resources: src/main/resources/direct-file
    defaults:
      run:
        working-directory: ${{ matrix.app }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Install xmllint
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils

      - name: Install Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/${{ matrix.resources }}/package-lock.json

      - name: Install the resource linters
        run: npm ci --prefix ${{ matrix.resources }}

      - name: Validate XML against the RELAX NG schemas
        run: make validate-xml

      - name: Reject HTML comments inside inline scripts
        run: make validate-templates

      - name: Lint JavaScript
        run: make validate-js

      - name: Validate the vendored USWDS distribution
        if: matrix.uswds
        run: make validate-uswds

      - name: Install sbt via shared action
        uses: IRSDigitalService/shared-actions/.github/actions/setup_sbt_coursier@d39382f7b23cb52c0762b5e321f29f2ed66e8189
        with:
          java_version: ${{ env.JAVA_VERSION }}
          sbt_version: ${{ env.SBT_VERSION }}

      - name: Check Scala formatting
        run: make validate-scala
