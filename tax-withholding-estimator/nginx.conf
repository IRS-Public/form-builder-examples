# Serves the prebuilt static site. Web root is the generator's ./out directory, so
# /app/tax-withholding-estimator/ and its resources/ resolve as written on disk.
# Each flow route is its own directory + index.html, so no SPA fallback is needed.
#
# Byte-for-byte credit-assistant/nginx.conf apart from this comment: a Formative app's
# output is the same shape whatever the app, and the URL prefix is inside the tree
# rather than in the server block.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }
}
