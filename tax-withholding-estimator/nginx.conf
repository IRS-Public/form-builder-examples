# Serves the prebuilt static site. Web root is the generator's ./out directory, so
# /app/tax-withholding-estimator/ and its resources/ resolve as written on disk.
# Each flow route is its own directory + index.html, so no SPA fallback is needed.
#
# This file used to be byte-for-byte credit-assistant/nginx.conf apart from this comment, because a
# Form Builder app's output is the same shape whatever the app and the URL prefix lived inside the
# tree rather than in the server block. The vendor/ cache location below is the one thing that has
# to name the prefix, so the four files now differ in exactly that line — and nothing else.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # DF-3. One navigation pulls ~10 MB of engine, fact dictionary and flow manifest, all of it
    # highly compressible text that compresses about 9x. The stock image sets no gzip directive, so
    # the default (off) stands and every byte of that goes out raw.
    #
    # text/html is compressed whenever gzip is on and must NOT be listed in gzip_types — naming it
    # there is a duplicate and nginx warns about it at startup.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_proxied      any;
    gzip_types        application/javascript text/javascript application/json
                      text/xml application/xml text/css image/svg+xml;

    # DF-4. With only ETag and Last-Modified the browser must revalidate every subresource on every
    # navigation — roughly 131 conditional requests per page, all answering 304.
    #
    # Everything under vendor/ is the engine bundle, the USWDS mirror and the vendored Taxpert
    # tree: generated content that changes only when the image is rebuilt.
    #
    # ^~ rather than a plain prefix so that this wins outright over the .html regex below. The
    # workspace clones its markup from vendored *.html templates, and those are vendor assets, not
    # pages being iterated on.
    location ^~ /app/tax-withholding-estimator/resources/vendor/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The generated pages, on the other hand, are exactly the thing being iterated on: revalidate
    # every time. An immutable page is a page you cannot iterate on.
    #
    # A directory request reaches here too: `index` internally redirects a directory URL to
    # its index.html, and an internal redirect re-runs location matching.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
