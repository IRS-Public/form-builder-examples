<!--/*
  What the Tax Withholding Estimator needs in <head> to mount the Taxpert workspace over its flow.

  The scaffold replaces this only under --auditMode (see formative's fragments/head.html), and ships
  an empty default. Everything below names a path inside `vendor/taxpert/`, which is exactly why the
  file is here rather than in the library: taxpert is the one dependency this app could drop, and the
  scaffold names nothing inside it.

  Every URL is built from ${basePath}, so nothing here repeats this app's route prefix.
*/-->
<th:block th:fragment="workspace-head">
    <link rel="stylesheet" th:href="|${basePath}/resources/vendor/taxpert/audit-panel/styles/audit-panel.css|"
          id="audit-panel-styles" disabled />

    <!-- The global nav clones its markup from this file, and it is the first thing on every page, so
         start the fetch alongside the module rather than after it parses. (The audit panel's templates
         need no preload: it is invisible until enable(), by which time they have landed.) -->
    <link rel="preload" as="fetch" crossorigin
          th:href="|${basePath}/resources/vendor/taxpert/global-nav/templates/global-nav.html|" />

    <script type="module" th:src="|${basePath}/resources/vendor/taxpert/audit-panel/js/taxpert-audit-panel.js|"></script>
    <script type="module" th:src="|${basePath}/resources/vendor/taxpert/global-nav/js/taxpert-global-nav.js|"></script>
    <!-- The workspace tool panels (the nav's Tools button). Unlike the audit panel's, this bundle's
         stylesheet is not behind a toggled `disabled` link: every selector in it is scoped to the
         bundle's own custom elements and .ttd-/.ttp-/.ttm- classes, so it restructures nothing in the
         product page — the same reason global-nav.css loads unconditionally through main.css. The dock
         hides itself unless a tool is switched on. -->
    <script type="module" th:src="|${basePath}/resources/vendor/taxpert/tool-panels/js/taxpert-tool-dock.js|"></script>

    <!-- The workspace sub-nav on the product pages (page.html mounts
         <taxpert-screens-toolbar mode="product">): the bar under the global nav that names which
         destination you are on. Browse All / Path Mode load the same two files from
         fragments/workspace-all-screens.html, which is *not* gated on --auditMode — that page is
         chrome all the way down and exists without a workspace. So on an --auditMode --allScreens
         build the listing page links this stylesheet twice, from the two independent conditions.
         Same URL, same rules, one fetch: keeping the conditions separate is worth more than the
         duplicate is worth avoiding. -->
    <link rel="stylesheet" th:href="|${basePath}/resources/vendor/taxpert/audit-panel/styles/all-screens-toolbar.css|" />
    <script type="module" th:src="|${basePath}/resources/vendor/taxpert/audit-panel/js/all-screens-toolbar.js|"></script>

    <!-- The nav's workspace switch. Listened for on `document` rather than on the element, because
         this runs in <head> and the nav does not exist yet; the event is dispatched with
         bubbles+composed for exactly this. -->
    <script type="module" th:inline="javascript">
        import { enable, disable } from /*[[|${basePath}/resources/vendor/taxpert/audit-panel/js/taxpert-audit-panel.js|]]*/ ''
        document.addEventListener('workspace-toggle', (event) => {
            if (event.detail.on) enable()
            else disable()
        })
    </script>
</th:block>
