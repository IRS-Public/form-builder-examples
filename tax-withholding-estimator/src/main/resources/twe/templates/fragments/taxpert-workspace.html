<div th:fragment="taxpert-workspace" th:remove="tag">
    <!--
      The shared workspace's two body-level elements: the audit panel and the tool dock.

      Both sit outside .app-container as direct children of <body>, because `.audit-mode` turns
      <body> into a flex row and they are its other columns — that is what makes the page content
      reflow beside them with no fixed positioning.

      The panel's rail is gone (the tool panels replaced it), but the element stays mounted: it
      still creates and owns the Scenario, Display and Workspace-settings modals. Its id is
      deliberately NOT `twe-audit-panel` — that one belongs to this app's own aside, which can be on
      screen at the same time whenever the `legacyAuditPanel` flag is on.

      No api-base or scenarios-base attributes: this app serves no scenario JSONs and runs no chat
      backend, so the panel falls through to config.endpoints, where both are empty. See
      fragments/taxpert-config.html.
    -->
    <taxpert-audit-panel id="taxpert-workspace"
        aria-label="Taxpert workspace"
        fact-dictionary-url="/app/tax-withholding-estimator/resources/fact-dictionary.xml"></taxpert-audit-panel>

    <!--
      `hidden` mirrors the workspace switch. This fragment is only built into an --auditMode page,
      where the workspace starts on, so the dock starts visible and the listener below follows the
      switch from there. Without that the dock — which remembers in localStorage which tools were
      open — could come back on a page where the button that closes them isn't offered.
    -->
    <taxpert-tool-dock></taxpert-tool-dock>

    <script type="module">
        // The nav owns the workspace switch; the dock follows it. The panel's own enable()/disable()
        // wiring lives in fragments/taxpert-global-nav.html.
        const dock = document.querySelector('taxpert-tool-dock')
        document.querySelector('taxpert-global-nav')?.addEventListener('workspace-toggle', (event) => {
            dock?.toggleAttribute('hidden', !event.detail.on)
        })
    </script>
</div>
