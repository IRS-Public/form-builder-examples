# This application's own strings. The chrome the scaffold's templates need
# (components.*, errors.*, step-indicator.*, layout.banner.*, …) ships with the
# scaffold; declare a key here to override any of it.
components:
  select:
    select: -- Select one --
title:
  prefix: Tax Withholding Estimator
  suffix: Internal Revenue Service
layout:
  title: Tax Withholding Estimator
alerts:
  warning:
    heading: Warning status
errors:
  IncompleteWritableDate: Enter a complete date or leave blank.
  Required: This question is required.
  Default: Sorry, something went wrong.
# Section headings for the Browse All / Path Mode listing. One key per flow module
# (flow/index.xml), keyed by its filename; `other` is the bucket for a page that belongs to no
# module. The page-count and condition-count phrasings are the scaffold's.
all-screens:
  section:
    about-you: About you
    income: Income & tax payments
    adjustments: Adjustments
    deductions: Deduction choice
    additional-deductions: Additional deductions
    credits: Credits
    results: Results
    other: Other
workspace:
  tools:
    inspect: Inspect
    inspect-description: Inspect facts, flows and text.
    outcome-tracker: Outcome tracker
    outcome-tracker-description: Track the outcomes this application determines.
    watchlist: Watchlist
    watchlist-description: Track the value of one or more facts as you work or load scenarios.
    overrides: Overrides
    overrides-description: Set a fact directly, without walking the flow to the screen that asks for it.
  outcomes:
    withholding-outcome: Withholding outcome
    balance-due: Balance due of {abs}
    refund: Refund of {abs}
    on-target: On target
    owed-vs-withheld: Owed vs. withheld
    direction: Direction
    underpayment-risk: Underpayment penalty risk
    at-risk: At risk
    not-at-risk: Not at risk
    penalty-thresholds: Penalty thresholds
    adjustment-headroom: Can still adjust withholding
    can-adjust: 'Yes'
    estimated-payments-only: No — estimated payments only
    remaining-pay-periods: Remaining pay periods
    estimated-payments: Estimated payments
results:
  fg-withholding-adjustments:
    w-4:
      summary: Adjust <span condition="/jobs/*/isFilerAssignmentSelf" operator="isTrue">your</span><span condition="/jobs/*/isFilerAssignmentSelf" operator="isFalse">their</span> <fg-show path="/jobs/*/grossIncome"/> W-2 job
      download-and-submit: Download and complete Form W-4 using our recommendations below, then submit it to <span condition="/jobs/*/isFilerAssignmentSelf" operator="isTrue">your</span><span condition="/jobs/*/isFilerAssignmentSelf" operator="isFalse">their</span> employer.
      update-employer-software: Or, use our recommendations to adjust <span condition="/jobs/*/isFilerAssignmentSelf" operator="isTrue">your</span><span condition="/jobs/*/isFilerAssignmentSelf" operator="isFalse">their</span> withholding directly in <span condition="/jobs/*/isFilerAssignmentSelf" operator="isTrue">your</span><span condition="/jobs/*/isFilerAssignmentSelf" operator="isFalse">their</span> employer’s payroll or human resource software.
      download-pre-filled: Download pre-filled Form W-4
      download-blank: Download blank Form W-4
      recommendations:
        caption: Instructions for completing Form W-4
        field: W-4 field
        recommendation: How to answer
        1-a-field: 'Step 1 (a): Personal information'
        1-a-recommendation: Enter <span condition="/jobs/*/isFilerAssignmentSelf" operator="isTrue">your</span><span condition="/jobs/*/isFilerAssignmentSelf" operator="isFalse">their</span> name and address
        1-b-field: 'Step 1 (b): Social security number'
        1-b-recommendation: Enter <span condition="/jobs/*/isFilerAssignmentSelf" operator="isTrue">your</span><span condition="/jobs/*/isFilerAssignmentSelf" operator="isFalse">their</span> Social Security number
        1-c-field: 'Step 1 (c): Filing status'
        1-c-recommendation: <p><span condition="/isFilingStatusMFJ" operator="isTrue">Married filing jointly</span><span condition="/isFilingStatusMFS" operator="isTrue">Married filing separately</span><span condition="/isFilingStatusSingle" operator="isTrue">Single</span><span condition="/isFilingStatusHOH" operator="isTrue">Head of household</span><span condition="/isFilingStatusQSS" operator="isTrue">Qualified surviving spouse</span></p><p><modal-link for="modal-why-step-1-c">Why?</modal-link></p>
        2-c-field: 'Step 2 (c): Multiple jobs or spouse works'
        2-c-recommendation: <p>Don’t check this box</p><p><modal-link for="modal-why-w-4-step-2-c">Why?</modal-link></p>
        3-field: 'Step 3: Credits total'
        3-recommendation: <p><span condition="/jobs/*/shouldLeaveW4Line3Blank" operator="isFalse"><fg-show path="/jobs/*/w4Line3WithSplitWithholdingStrategy"/></span><span condition="/jobs/*/shouldLeaveW4Line3Blank" operator="isTrue">Leave blank</span></p><p><modal-link for="modal-why-step-3">Why?</modal-link></p>
        4-a-field: 'Step 4 (a): Other income (not from jobs)'
        4-a-recommendation: <p><span condition="/jobs/*/shouldLeaveW4Line4aBlank" operator="isFalse"><fg-show path="/jobs/*/w4Line4aWithSplitWithholdingStrategy"/></span><span condition="/jobs/*/shouldLeaveW4Line4aBlank" operator="isTrue">Leave blank</span></p><p><modal-link for="modal-why-w-4-step-4-a">Why?</modal-link></p>
        4-b-field: 'Step 4 (b): Deductions'
        4-b-recommendation: <p><span condition="/jobs/*/shouldLeaveW4Line4bBlank" operator="isFalse"><fg-show path="/jobs/*/w4Line4bWithSplitWithholdingStrategy"/></span><span condition="/jobs/*/shouldLeaveW4Line4bBlank" operator="isTrue">Leave blank</span></p><p><modal-link for="modal-why-w-4-step-4-b">Why?</modal-link></p>
        4-c-field: 'Step 4 (c): Extra withholding'
        4-c-recommendation: <p><span condition="/jobs/*/shouldLeaveW4Line4cBlank" operator="isFalse"><fg-show path="/jobs/*/w4Line4cWithSplitWithholdingStrategy"/></span><span condition="/jobs/*/shouldLeaveW4Line4cBlank" operator="isTrue">Leave blank</span></p><p><modal-link for="modal-why-w-4-step-4-c">Why?</modal-link></p>
        5-field: 'Step 5: Sign Here'
        5-recommendation: Sign and enter the date
      time-sensitivity: Withholding updates are time sensitive. Submit your completed form to <span condition="/jobs/*/isFilerAssignmentSelf" operator="isTrue">your</span><span condition="/jobs/*/isFilerAssignmentSelf" operator="isFalse">their</span> employer as soon as possible.
    w-4p:
      summary: Adjust <span condition="/pensions/*/isFilerAssignmentSelf" operator="isTrue">your</span><span condition="/pensions/*/isFilerAssignmentSelf" operator="isFalse">their</span> <fg-show path="/pensions/*/grossIncome"/> <span condition="/pensions/*/isInFuture" operator="isTrue">future</span> pension or annuity
      download-and-submit: Download and complete Form W-4P using our recommendations below, then submit it to <span condition="/pensions/*/isFilerAssignmentSelf" operator="isTrue">your</span><span condition="/pensions/*/isFilerAssignmentSelf" operator="isFalse">their</span> <span condition="/pensions/*/isInFuture" operator="isTrue">new</span> pension or annuity provider.
      download-pre-filled: Download pre-filled Form W-4P
      download-blank: Download blank Form W-4P
      recommendations:
        caption: Instructions for completing Form W-4P
        field: W-4P field
        recommendation: How to answer
        1-a-field: 'Step 1 (a): Personal information'
        1-a-recommendation: Enter <span condition="/pensions/*/isFilerAssignmentSelf" operator="isTrue">your</span><span condition="/pensions/*/isFilerAssignmentSelf" operator="isFalse">their</span> name and address
        1-b-field: 'Step 1 (b): Social security number'
        1-b-recommendation: Enter <span condition="/pensions/*/isFilerAssignmentSelf" operator="isTrue">your</span><span condition="/pensions/*/isFilerAssignmentSelf" operator="isFalse">their</span> Social Security number
        1-c-field: 'Step 1 (c): Filing status'
        1-c-recommendation: <p><span condition="/isFilingStatusMFJ" operator="isTrue">Married filing jointly</span><span condition="/isFilingStatusMFS" operator="isTrue">Married filing separately</span><span condition="/isFilingStatusSingle" operator="isTrue">Single</span><span condition="/isFilingStatusHOH" operator="isTrue">Head of household</span><span condition="/isFilingStatusQSS" operator="isTrue">Qualified surviving spouse</span></p><p><modal-link for="modal-why-step-1-c">Why?</modal-link></p>
        2-field: 'Step 2: Multiple jobs or pensions'
        2-recommendation: <p>Leave blank</p><p><modal-link for="modal-why-w-4p-step-2">Why?</modal-link></p>
        3-field: 'Step 3: Credits total'
        3-recommendation: <p><span condition="/pensions/*/shouldLeaveW4pLine3Blank" operator="isFalse"><fg-show path="/pensions/*/w4pLine3WithSplitWithholdingStrategy"/></span><span condition="/pensions/*/shouldLeaveW4pLine3Blank" operator="isTrue">Leave blank</span></p><p><modal-link for="modal-why-step-3">Why?</modal-link></p>
        4-a-field: 'Step 4 (a): Other income (not from jobs)'
        4-a-recommendation: <p><span condition="/pensions/*/shouldLeaveW4pLine4aBlank" operator="isFalse"><fg-show path="/pensions/*/w4pLine4aWithSplitWithholdingStrategy"/></span><span condition="/pensions/*/shouldLeaveW4pLine4aBlank" operator="isTrue">Leave blank</span></p><p><modal-link for="modal-why-w-4p-step-4-a">Why?</modal-link></p>
        4-b-field: 'Step 4 (b): Deductions'
        4-b-recommendation: <p><span condition="/pensions/*/shouldLeaveW4pLine4bBlank" operator="isFalse"><fg-show path="/pensions/*/w4pLine4bWithSplitWithholdingStrategy"/></span><span condition="/pensions/*/shouldLeaveW4pLine4bBlank" operator="isTrue">Leave blank</span></p><p><modal-link for="modal-why-w-4p-step-4-b">Why?</modal-link></p>
        4-c-field: 'Step 4 (c): Extra withholding'
        4-c-recommendation: <p><span condition="/pensions/*/shouldLeaveW4pLine4cBlank" operator="isFalse"><fg-show path="/pensions/*/w4pLine4cWithSplitWithholdingStrategy"/></span><span condition="/pensions/*/shouldLeaveW4pLine4cBlank" operator="isTrue">Leave blank</span></p><p><modal-link for="modal-why-w-4p-step-4-c">Why?</modal-link></p>
        5-field: 'Step 5: Sign Here'
        5-recommendation: Sign and enter the date
      time-sensitivity: Withholding updates are time sensitive. Submit your completed form to <span condition="/pensions/*/isFilerAssignmentSelf" operator="isTrue">your</span><span condition="/pensions/*/isFilerAssignmentSelf" operator="isFalse">their</span> <span condition="/pensions/*/isInFuture" operator="isTrue">new</span> pension or annuity provider as soon as possible.
