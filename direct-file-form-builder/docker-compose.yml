# Direct File — the prod-like stack, in one command.
#
#   docker compose up --build                          # dev: hot reload (the overlay applies)
#   docker compose -f docker-compose.yml up --build     # prod-like: ignore the overlay
#
# Open: http://localhost:3008/app/direct-file/
#
# fact-graph, form-builder and taxpert are not guaranteed to sit beside this repo, so each is its own
# named build context (`additional_contexts` below) instead of a subdirectory of a shared parent.
# The paths are exactly what this app was generated with (fact_graph_path / form_builder_path /
# taxpert_path in cookiecutter.json). Edit them here too if a library checkout moves.
#
# There is no server at runtime. The generated site is fully static, so this service is nginx over
# the generator's ./out, and which developer surfaces exist was decided by the flags on `sbt run`
# inside the image.

services:
  direct-file-form-builder:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        fact_graph: ../../fact-graph
        form-builder: ../../form-builder
        taxpert: ../../taxpert/packages/ui
    ports:
      - "3008:80"
    environment:
      # The port the startup banner tells you to open. The container sees only its own :80, so this
      # has to repeat the published port above — change both, or the printed address is wrong.
      APP_PORT: "3008"
    restart: unless-stopped
