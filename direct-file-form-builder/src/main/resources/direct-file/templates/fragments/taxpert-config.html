<div th:fragment="taxpert-config" th:remove="tag">
    <!--
      Everything Direct File tells taxpert about itself.

      The shared workspace — the global nav, the audit panel, the tool panels — ships knowing
      nothing about the application under it. It has no menu, no determinations and no route prefix
      until a host calls configure(). This is that call, and it runs on every page that mounts the
      workspace. The scaffold ships an empty default of this file; this one wins because app
      templates resolve ahead of the library's.

      WHY A THYMELEAF FRAGMENT AND NOT A .js FILE. Everything here that a person reads and that
      belongs to the *product* — the outcome headings, the words an outcome is spoken in — is a
      Thymeleaf message expression, resolved per locale at build time. (The nav labels are the
      exception, and say why at `nav:` below.) website-static/js is served as static assets
      and never passes through Thymeleaf, so a label written there would be English in the Spanish
      build. Behaviour that cannot be a translated literal — the fact-graph port and the fact paths
      themselves — lives in website-static/js/taxpert/direct-file-graph.js and is imported below.

      th:inline="javascript" is what makes those expressions resolve inside a script element; it
      works on a type="module" script, and Thymeleaf JS-escapes each value as it substitutes it.
      Note that message expressions are inlined inside comments too, which is why this one spells
      none of them out.

      ORDER DOES NOT MATTER. taxpert reads its configuration when an element *renders*, not when it
      loads, and configure() dispatches `taxpert:config-changed` so anything already on screen
      rebuilds.
    -->
    <script type="module" th:inline="javascript">
        import { configure, configureFromUrl } from /*[[|${basePath}/resources/vendor/taxpert/shared/js/config.js|]]*/ ''
        import { directFileGraph, directFileDeterminations } from /*[[|${basePath}/resources/js/taxpert/direct-file-graph.js|]]*/ ''

        // The build's locale, key by key. The determinations take a lookup rather than the strings
        // themselves because an outcome chooses its key at runtime, from a fact value nobody knows
        // here.
        // Every key directFileDeterminations() asks `t` for. A key missing here does not fail the
        // build — it renders in the tracker as the unresolved-message marker, doubled question marks
        // around the key and the locale — so the two lists are kept in step by reading them side by
        // side. Spelling that marker out here would put it in the page, which is the same trap the
        // header note about comments describes.
        const strings = new Map([
            ['workspace.outcomes.return', [[#{workspace.outcomes.return}]]],
            ['workspace.outcomes.refund-due', [[#{workspace.outcomes.refund-due}]]],
            ['workspace.outcomes.balance-owed', [[#{workspace.outcomes.balance-owed}]]],
            ['workspace.outcomes.income-and-tax', [[#{workspace.outcomes.income-and-tax}]]],
            ['workspace.outcomes.payments-and-credits', [[#{workspace.outcomes.payments-and-credits}]]],
            ['workspace.outcomes.the-result', [[#{workspace.outcomes.the-result}]]],
            ['workspace.outcomes.eitc', [[#{workspace.outcomes.eitc}]]],
            ['workspace.outcomes.qualifies', [[#{workspace.outcomes.qualifies}]]],
            ['workspace.outcomes.does-not-qualify', [[#{workspace.outcomes.does-not-qualify}]]],
            ['workspace.outcomes.eitc-eligibility', [[#{workspace.outcomes.eitc-eligibility}]]],
            ['workspace.outcomes.eitc-amount', [[#{workspace.outcomes.eitc-amount}]]],
            ['workspace.outcomes.ctc-odc', [[#{workspace.outcomes.ctc-odc}]]],
            ['workspace.outcomes.ctc-odc-eligibility', [[#{workspace.outcomes.ctc-odc-eligibility}]]],
            ['workspace.outcomes.ctc-odc-amount', [[#{workspace.outcomes.ctc-odc-amount}]]],
            ['workspace.outcomes.cdcc', [[#{workspace.outcomes.cdcc}]]],
            ['workspace.outcomes.receiving', [[#{workspace.outcomes.receiving}]]],
            ['workspace.outcomes.not-receiving', [[#{workspace.outcomes.not-receiving}]]],
            ['workspace.outcomes.cdcc-eligibility', [[#{workspace.outcomes.cdcc-eligibility}]]],
            ['workspace.outcomes.cdcc-amount', [[#{workspace.outcomes.cdcc-amount}]]],
            ['workspace.outcomes.ptc', [[#{workspace.outcomes.ptc}]]],
            ['workspace.outcomes.ptc-eligibility', [[#{workspace.outcomes.ptc-eligibility}]]],
            ['workspace.outcomes.ptc-amount', [[#{workspace.outcomes.ptc-amount}]]],
        ])
        const t = (key) => strings.get(key) ?? key

        configure({
            // storagePrefix is what stops this app and any other Form Builder app served from the same
            // origin sharing a fact graph, a watchlist or a panel layout. Every storage key the
            // workspace writes is namespaced with it.
            app: {
                id: 'direct-file',
                brand: [[#{layout.title}]],
                storagePrefix: 'direct-file',
            },

            // The app switcher. `id` is what a page passes as the nav's `active` attribute and what
            // toolsByDestination names below; `href` is a real link, so the menu navigates with no
            // JavaScript at all. Add a destination only when the page behind it exists — a menu
            // that offers a 404 is worse than a short menu.
            //
            // These labels are English literals, not #{workspace.nav.*} message expressions, and
            // that is the one deliberate exception to this file's "everything a person reads is a
            // message expression" rule. The language switcher is the *product's* control: picking a
            // language asks for the questionnaire in it. Translating the workspace around it put two
            // names on one destination in a single view — the sub-nav under the bar is taxpert's own
            // markup and reads "Product Experience" in every locale, while the menu item pointing at
            // it read the translated one. The workspace is one surface in one language; the product
            // underneath it is the thing that translates. `apps.items` below follows the same rule.
            nav: {
                menu: [
                    {
                        id: 'experience-explorer',
                        label: 'Experience Explorer',
                        children: [
                            { id: 'product-experience', label: 'Product Experience', href: /*[[|${basePath}/|]]*/ '' },
                            { id: 'path-mode', label: 'Path Mode', href: /*[[|${basePath}/all-screens/?mode=path|]]*/ '' },
                            { id: 'browse-all', label: 'Browse All', href: /*[[|${basePath}/all-screens/|]]*/ '' },
                        ],
                    },

                    // Fact Explorer holds every application beside this one, so the app id is part of
                    // the URL: a bare /fact-explorer lands on whichever is default rather than this
                    // one. Absolute, because it is served by the taxpert stack rather than this app.
                    { id: 'fact-explorer', label: 'Fact Explorer', href: 'http://localhost:5180/fact-explorer/direct-file' },

                    // Only when this site was built with --authorMode, which is what generates the
                    // page: `make up` and `make dev-author` pass it, a plain `make dev` and the
                    // production build do not. Gated on the build flag rather than offered always,
                    // because this file's rule above is that a menu which offers a 404 is worse than
                    // a short one. A `//` comment, never an HTML one — see the note in `apps` below.
                    ...((/*[[${flags.authorMode}]]*/ false) ? [
                        { id: 'authoring-suite', label: 'Authoring Suite', href: /*[[|${basePath}/author/|]]*/ '' },
                    ] : []),
                ],

                // Where each tool button in the bar applies. One generated page backs both listings,
                // told apart by `?mode=path`: Browse All shows every screen unconditionally, so only
                // Display applies there — nothing the other two do depends on an answer. Path Mode is
                // a reading of one Fact Graph, so all three do.
                toolsByDestination: [
                    { id: 'scenario', label: 'Scenario', icon: 'tune', destinations: ['product-experience', 'path-mode', 'fact-explorer'] },
                    { id: 'display', label: 'Display', icon: 'visibility', destinations: ['product-experience', 'path-mode', 'browse-all'] },
                    { id: 'tools', label: 'Tools', icon: 'build', destinations: ['product-experience', 'path-mode'] },
                ],
            },

            // The applications this workspace can be switched between — the "Applications" section
            // of Workspace settings (the nav's gear). All four of this repo's applications, so the
            // workspace carries over from any one of them to any other.
            //
            // Add a sibling by appending an entry with that app's own destinations. They have to be
            // written out: the workspace ships no notion of what 'browse-all' means as a URL, and an
            // app served from another origin cannot be derived from a base path. Use absolute URLs
            // for a sibling — this app's server serves only this app, so a relative path to another
            // would 404 — and keep our own root-relative so they survive being read through
            // Fact Explorer's dev proxy.
            //
            // Switching keeps the destination: Browse All here goes to Browse All there, falling
            // back to the sibling's first destination when it has no counterpart.
            apps: {
                current: 'direct-file',
                items: [
                    {
                        id: 'direct-file',
                        label: [[#{layout.title}]],
                        destinations: [
                            { id: 'product-experience', label: 'Product Experience', href: /*[[|${basePath}/|]]*/ '' },
                            { id: 'path-mode', label: 'Path Mode', href: /*[[|${basePath}/all-screens/?mode=path|]]*/ '' },
                            { id: 'browse-all', label: 'Browse All', href: /*[[|${basePath}/all-screens/|]]*/ '' },

                            { id: 'fact-explorer', label: 'Fact Explorer', href: 'http://localhost:5180/fact-explorer/direct-file' },

                            ...((/*[[${flags.authorMode}]]*/ false) ? [
                                { id: 'authoring-suite', label: 'Authoring Suite', href: /*[[|${basePath}/author/|]]*/ '' },
                            ] : []),
                        ],
                    },

                    // The three siblings, by absolute URL and by the port each one's Makefile
                    // declares — this app's server serves only this app, so a relative path to
                    // another would 404. Their Authoring Suite entries are unconditional here, the
                    // way theirs are for each other: this build cannot know what flags another
                    // application was built with, and the alternative is offering nothing.
                    {
                        id: 'credit-assistant',
                        label: 'EITC Assistant',
                        destinations: [
                            { id: 'product-experience', label: 'Product Experience', href: 'http://localhost:3003/app/eitc/' },
                            { id: 'path-mode', label: 'Path Mode', href: 'http://localhost:3003/app/eitc/all-screens/?mode=path' },
                            { id: 'browse-all', label: 'Browse All', href: 'http://localhost:3003/app/eitc/all-screens/' },
                            { id: 'fact-explorer', label: 'Fact Explorer', href: 'http://localhost:5180/fact-explorer/credit-assistant' },
                            { id: 'authoring-suite', label: 'Authoring Suite', href: 'http://localhost:3003/app/eitc/author/' },
                        ],
                    },
                    {
                        id: 'twe',
                        label: 'Tax Withholding Estimator',
                        destinations: [
                            { id: 'product-experience', label: 'Product Experience', href: 'http://localhost:3000/app/tax-withholding-estimator/' },
                            { id: 'path-mode', label: 'Path Mode', href: 'http://localhost:3000/app/tax-withholding-estimator/all-screens/?mode=path' },
                            { id: 'browse-all', label: 'Browse All', href: 'http://localhost:3000/app/tax-withholding-estimator/all-screens/' },
                            { id: 'fact-explorer', label: 'Fact Explorer', href: 'http://localhost:5180/fact-explorer/twe' },
                        ],
                    },
                    {
                        id: 'benefits-enrollment',
                        label: 'Benefits Enrollment',
                        destinations: [
                            { id: 'product-experience', label: 'Product Experience', href: 'http://localhost:3006/app/benefits/' },
                            { id: 'path-mode', label: 'Path Mode', href: 'http://localhost:3006/app/benefits/all-screens/?mode=path' },
                            { id: 'browse-all', label: 'Browse All', href: 'http://localhost:3006/app/benefits/all-screens/' },
                            { id: 'fact-explorer', label: 'Fact Explorer', href: 'http://localhost:5180/fact-explorer/benefits-enrollment' },
                            { id: 'authoring-suite', label: 'Authoring Suite', href: 'http://localhost:3006/app/benefits/author/' },
                        ],
                    },
                ],
            },

            endpoints: {
                basePath: /*[[${basePath}]]*/ '',
                scenariosBase: /*[[|${basePath}/resources/scenarios|]]*/ '',
                factDictionaryUrl: /*[[|${basePath}/resources/fact-dictionary.xml|]]*/ '',
            },

            tools: [
                { id: 'inspect', label: [[#{workspace.tools.inspect}]], description: [[#{workspace.tools.inspect-description}]], templateId: 'ttp-body-inspect' },
                { id: 'outcome-tracker', label: [[#{workspace.tools.outcome-tracker}]], description: [[#{workspace.tools.outcome-tracker-description}]], templateId: 'ttp-body-outcome-tracker' },
                { id: 'watchlist', label: [[#{workspace.tools.watchlist}]], description: [[#{workspace.tools.watchlist-description}]], templateId: 'ttp-body-watchlist' },
            ],

            graph: directFileGraph,
            determinations: directFileDeterminations(t),
        })

        // The per-deployment layer: the same configuration as data, in a file this deployment
        // serves. It lands after the call above — it is fetched — and configure() merges, so a
        // deployment's file wins over the build's own values while a person's Workspace-settings
        // overrides still win over both.
        //
        // The shipped file is `{}`: this deployment overrides nothing. Edit it to change what the
        // workspace tracks, offers or points at without touching a template — the change is then
        // reviewable in git, which a localStorage override never is. Anything a person *reads*
        // belongs above rather than in it: the file is served once and is not per-locale.
        configureFromUrl(/*[[|${basePath}/resources/taxpert.config.json|]]*/ '')
    </script>
</div>
