# Development overlay — Docker Compose auto-merges this on top of docker-compose.yml.
#
#   docker compose up --build                          # this file applies
#   docker compose -f docker-compose.yml up --build     # ignore it, build the prod-like image
#
# Edit source on the host and the site regenerates inside the container; then refresh the browser.
#
# WHY THIS IS TWO SERVICES. The static-site generator has no browser hot-module-reload — there is no
# dev server, only a directory of HTML. So the job is split: nginx serves whatever is in the shared
# `out` volume, and a second container runs `sbt ~run` writing into that same volume on every source
# edit. Neither half works alone; adding the volume without the watcher leaves nginx serving an
# empty directory, which looks like a broken build rather than a missing service.
#
# macOS bind mounts do not emit filesystem events, so sbt's watcher is left on its polling default
# rather than relying on native notifications.

services:
  # nginx now serves a live-regenerated volume instead of the site baked into the image.
  direct-file-form-builder:
    volumes:
      - app-out:/usr/share/nginx/html
    environment:
      # Unlocks the Author Mode / Browse All / Fact Explorer lines in the startup banner. The flags
      # on the watcher below are what actually generate those pages, and this says so out loud —
      # set here rather than in the Dockerfile so the prod-like image, which passes no flags, does
      # not advertise pages it never built.
      APP_DEV_SURFACES: "1"

  # The watcher. `target: build` stops at the stage that has sbt, the sibling libraries in the local
  # Ivy cache and the vendored assets already in place — the image's own `sbt run` at that stage
  # doubles as a warm compile cache, so the first `~run` here is seconds rather than minutes.
  #
  # The flags mirror `make dev-author` minus --serve: the in-process server binds localhost inside
  # the container and would not be reachable through a published port, so nginx above does the
  # serving. Keep the two in step — a flag added to `make dev` and not here is a surface that exists
  # natively and silently does not exist in Docker.
  direct-file-form-builder-watch:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
      additional_contexts:
        fact_graph: ../../fact-graph
        form-builder: ../../form-builder
        taxpert: ../../taxpert/packages/ui
    working_dir: /build/direct-file-form-builder
    environment:
      SBT_OPTS: "-Xmx2g"

    # Author Mode's API, and the only port this stack opens besides the site itself.
    #
    # 127.0.0.1 rather than a bare port, deliberately. This API patches the flow XML and the fact
    # dictionary *on disk* through the bind mount below, so it is a write endpoint into your working
    # tree; published bare it would accept writes from anything that can route to this machine. The
    # loopback binding is the same posture `make dev-author` gets for free by listening on localhost.
    ports:
      - "127.0.0.1:3009:3009"

    # -Dsmol.author.host=0.0.0.0 is what makes that mapping reach anything: the API defaults to
    # localhost, which inside a container is the container, so a published port would forward to a
    # socket nobody is listening on and the editor would sit on "Connecting to the authoring
    # server…" forever. FormBuilder.scala says as much where it reads the property. The narrow bind
    # moves to the host side of the mapping, above, which is why both halves have to be here.
    command:
      [
        "sbt",
        "-Dsmol.author.host=0.0.0.0",
        "-Dsmol.author.port=3009",
        "~run --auditMode --allScreens --scenarioMode --authorMode",
        # No --singleQuestionPerScreen, and for the reason `make dev-author` gives: Author Mode edits
        # the Flow XML on disk, and the splitter's pages are not on disk.
      ]
    volumes:
      # This app's own source, live — sbt's watcher picks up an edit on the host immediately.
      - .:/build/direct-file-form-builder
      - app-out:/build/direct-file-form-builder/out
      # Named, so a rebuild does not re-download every dependency.
      - sbt-cache:/root/.cache/coursier

      # Live shared-UI source over the baked-in `make copy-shared-ui` mirror, so an edit in
      # ../../taxpert/packages/ui shows up here without an image rebuild. One mount of the
      # whole tree rather than one per bundle: a per-bundle list is a copy of that package's
      # directory listing that nothing keeps in step, and a bundle missing from it is invisible
      # until someone wonders why their edits do nothing.
      - ../../taxpert/packages/ui/src:/build/direct-file-form-builder/src/main/resources/direct-file/website-static/vendor/taxpert:ro

      # The engine bundle and the design system are built INSIDE the image, and must not be
      # shadowed. The bind mount of this repo, above, replaces /build/direct-file-form-builder wholesale with the
      # host's copy — and both of these are gitignored, so on a fresh clone they are empty or
      # absent. The generator would then copy nothing into out/, and the served site would come back
      # with no fact-graph engine and no USWDS: a page that renders but cannot evaluate a fact.
      #
      # A named volume nested under a bind mount is seeded from the image on first creation, exactly
      # as app-out is, so both arrive from the image and `make up` needs no host toolchain at all.
      # That is the whole claim of this overlay, and without these two lines it is false.
      #
      # Neither is a live-edit mount, because neither has a source tree on the host to point at: the
      # engine bundle is stage 1's fastOptJS output and the USWDS mirror is stage 2's
      # `make copy-uswds`.
      #
      # To pick up a change to either, **rebuilding the image is not enough** — `make rebuild`, or
      # `docker compose down` and `docker volume rm <project>_vendor-fact-graph`. A named volume is
      # seeded from the image only when it is *created*; after that it is the volume's content that
      # wins, and `up --build` keeps serving what the volume already holds however many times the
      # image is rebuilt. That cost a debugging session: a fixed Pin/IpPin `parseString` in
      # ~/fact-graph, a correct bundle in the image, and a browser still loading the old engine and
      # blowing its stack on any scenario carrying a PIN. The seeding-on-first-creation behaviour
      # above is what makes `make up` work with no host toolchain; this is its other half.
      - vendor-fact-graph:/build/direct-file-form-builder/src/main/resources/direct-file/website-static/vendor/fact-graph
      - vendor-uswds:/build/direct-file-form-builder/src/main/resources/direct-file/website-static/vendor/uswds-3.13.0

    restart: unless-stopped

  # fact-graph and form-builder are NOT live-mounted: sbt resolves them out of /root/.ivy2, which the
  # image's publishLocal stage (see additional_contexts above) baked in during the build. Editing
  # either one still needs `docker compose build`.

volumes:
  app-out:
  sbt-cache:
  vendor-fact-graph:
  vendor-uswds:
